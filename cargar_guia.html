itiva después de revisar la factura\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nSeñor(a) [NOMBRE], muchas gracias por compartirnos la factura.\nDespués de revisar la información, le confirmamos que su vehículo cumple preliminarmente con los criterios que debemos validar para acceder al beneficio tributario.\nGómez Legal Abogados realiza el acompañamiento y la gestión ante la UPME y la DIAN de principio a fin. Por ser cliente SURA, nuestros honorarios por la gestión integral son de $714.000 IVA incluido, como pago único. La tarifa correspondiente al certificado de la UPME se paga de manera independiente y es determinada por esa entidad.\nPara continuar con la validación documental e iniciar la gestión, por favor compártanos su RUT actualizado y copia legible de su cédula por ambas caras. Con estos documentos podremos preparar el contrato de prestación de servicios y avanzar con el siguiente paso.\n↩ Volver al inicio\n\nNota interna para el agente: En conversaciones con avance positivo funcionó bien revisar primero la factura, confirmar prefactibilidad y cerrar inmediatamente con una solicitud documental concreta. Evite prometer aprobación definitiva antes de completar la revisión."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 82. Cliente interesado que solicita seguridad antes de contratar","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 82. Cliente interesado que solicita seguridad antes de contratar\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nEntendemos su inquietud, señor(a) [NOMBRE], y es completamente válido que quiera tener claridad antes de contratar el servicio.\nNuestro equipo ya realizó una revisión preliminar de la factura y, con la información disponible, su caso presenta viabilidad para continuar con el proceso. La validación definitiva depende de que la documentación esté completa y sea consistente, así como de la evaluación que realizan la UPME y la DIAN.\nPrecisamente nuestro acompañamiento busca revisar la documentación antes de cada radicación, reducir errores y gestionar el proceso de principio a fin.\nSi está de acuerdo, podemos avanzar ahora con la revisión de su RUT y cédula para preparar el contrato de prestación de servicios.\n↩ Volver al inicio\n\nNota interna para el agente: Este enfoque responde directamente a la objeción de riesgo sin utilizar expresiones absolutas como «garantizado» o «100 % seguro». La conversación positiva revisada avanzó cuando se reconoció primero la preocupación del cliente y luego se propuso un siguiente paso concreto."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 83. Cliente confirma que desea continuar","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 83. Cliente confirma que desea continuar\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nPerfecto, señor(a) [NOMBRE]. Muchas gracias por confirmarnos que desea continuar con el servicio.\nEl siguiente paso es formalizar la contratación. Prepararemos el contrato de prestación de servicios de Gómez Legal Abogados y lo enviaremos al correo electrónico registrado en su RUT para su firma digital.\nUna vez lo reciba, por favor revíselo y fírmelo. Cuando tengamos la confirmación de la firma, le indicaremos el paso correspondiente al pago y continuaremos con la gestión.\nSi tiene alguna inquietud antes de firmar, con gusto la resolvemos por este mismo medio.\n↩ Volver al inicio\n\nNota interna para el agente: El cierre debe ser secuencial: aceptación → contrato → firma → pago → inicio de gestión. No vuelva a explicar todo el beneficio si el cliente ya confirmó su decisión."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 84. Envío del contrato para firma digital","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 84. Envío del contrato para firma digital\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nSeñor(a) [NOMBRE], le confirmamos que acabamos de enviar el contrato de prestación de servicios de Gómez Legal Abogados al correo electrónico registrado en su RUT.\nEl documento llegará a través de la plataforma de firma electrónica [PLATAFORMA/REMITENTE]. En el cuerpo del correo encontrará el enlace para revisar y firmar digitalmente el contrato.\nPor favor, una vez complete la firma, confírmenos por este mismo medio para verificar su recepción y continuar inmediatamente con el proceso.\n↩ Volver al inicio\n\nNota interna para el agente: En los chats con resultado positivo, indicar el remitente/plataforma y pedir confirmación inmediata redujo la incertidumbre sobre dónde encontrar el contrato."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 85. Cliente confirma que ya firmó el contrato","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 85. Cliente confirma que ya firmó el contrato\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nMuchas gracias, señor(a) [NOMBRE]. Le confirmamos que recibimos correctamente el contrato firmado.\nEl siguiente paso corresponde al pago de los honorarios de Gómez Legal Abogados por valor de [VALOR DEL SERVICIO]. Le enviaremos las instrucciones o el medio de pago autorizado para realizarlo.\nUna vez efectúe el pago, por favor compártanos el comprobante por este mismo chat. Con la confirmación del pago y la documentación completa podremos dar continuidad inmediata a la gestión.\n↩ Volver al inicio\n\nNota interna para el agente: Utilice únicamente los medios de pago autorizados y vigentes. La guía no debe fijar números de cuenta como texto permanente si estos pueden cambiar; valide siempre el dato operativo antes de enviarlo."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 86. Confirmación de recepción del pago de honorarios","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 86. Confirmación de recepción del pago de honorarios\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nSeñor(a) [NOMBRE], muchas gracias. Le confirmamos la recepción del comprobante de pago.\nCon el contrato firmado y el pago confirmado, continuaremos con la gestión de su caso. En este momento verificaremos que la documentación requerida esté completa para avanzar sin demoras.\nActualmente tenemos: [DOCUMENTOS RECIBIDOS].\nNos queda pendiente: [DOCUMENTOS PENDIENTES].\nPor favor, envíenos lo pendiente por este mismo medio y le confirmaremos tan pronto el expediente quede completo.\n↩ Volver al inicio\n\nNota interna para el agente: Después del pago, evite respuestas genéricas. Indique claramente qué se recibió, qué falta y cuál es el siguiente hito."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 87. Cliente quiere agilizar el proceso","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 87. Cliente quiere agilizar el proceso\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nClaro que sí, señor(a) [NOMBRE]. Podemos avanzar de inmediato.\nPara darle la mayor agilidad posible, necesitamos completar estos pasos:\n1. Firma del contrato de prestación de servicios.\n2. Confirmación del pago de los honorarios.\n3. Recepción de la documentación pendiente: [DOCUMENTOS].\nTan pronto tengamos estos elementos completos, nuestro equipo podrá continuar con la gestión correspondiente ante la UPME.\nSi está de acuerdo, procedemos ahora mismo con el envío del contrato para su firma.\n↩ Volver al inicio\n\nNota interna para el agente: Este patrón apareció en una conversación donde el cliente pidió expresamente agilizar el contrato. La respuesta debe convertir esa intención en acciones concretas y ordenadas."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 88. Cliente ya tiene certificado UPME y desea contratar la gestión DIAN","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 88. Cliente ya tiene certificado UPME y desea contratar la gestión DIAN\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nPerfecto, señor(a) [NOMBRE]. Si usted ya cuenta con el certificado de la UPME, podemos revisar directamente la documentación necesaria para continuar con la etapa ante la DIAN.\nAntes de radicar, verificaremos que la información del certificado coincida con la factura, el RUT y los datos del titular. Por ser cliente SURA, la tarifa vigente definida para la gestión de esta etapa es de $357.000 IVA incluido, como pago único.\nPara avanzar, por favor compártanos el certificado UPME, la factura, el RUT actualizado y copia de su cédula. Una vez revisados, prepararemos el contrato y los documentos correspondientes para continuar con el proceso.\n↩ Volver al inicio\n\nNota interna para el agente: Este flujo debe usarse únicamente cuando el cliente ya tiene certificado UPME. Si existen diferencias entre certificado, factura o RUT, escale antes de prometer radicación."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 89. Seguimiento al contrato enviado pero aún no firmado","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 89. Seguimiento al contrato enviado pero aún no firmado\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nSeñor(a) [NOMBRE], esperamos que se encuentre muy bien.\nQueremos confirmar si pudo recibir y revisar el contrato de prestación de servicios que enviamos a su correo electrónico. Estamos atentos para resolver cualquier inquietud que tenga antes de firmarlo.\nSi está de acuerdo con continuar, puede completar la firma desde el enlace recibido y confirmarnos por este medio. Con gusto le acompañaremos con el siguiente paso.\n↩ Volver al inicio\n\nNota interna para el agente: El seguimiento debe reducir presión comercial y aumentar confianza: confirmar recepción, ofrecer aclaraciones y cerrar con una acción sencilla."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 90. Seguimiento a cliente interesado pendiente de pago","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 90. Seguimiento a cliente interesado pendiente de pago\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nSeñor(a) [NOMBRE], esperamos que se encuentre muy bien.\nEstamos haciendo seguimiento a su proceso. Su contratación ya se encuentra avanzada y estamos atentos a la confirmación del pago para continuar con la gestión correspondiente.\nSi tiene alguna inquietud sobre el pago o sobre el proceso antes de realizarlo, por favor indíquenos. Estamos aquí para ayudarle y acompañarlo en cada paso.\nCuando realice el pago, puede enviarnos el comprobante por este mismo medio y continuaremos con la gestión.\n↩ Volver al inicio\n\nNota interna para el agente: Evite mensajes que suenen a cobranza. El objetivo es remover la barrera que está impidiendo el avance y mantener un CTA claro."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 91. Confirmación integral: contrato firmado + pago + documentación completa","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 91. Confirmación integral: contrato firmado + pago + documentación completa\n\nRESPUESTA PREDEFINIDA AL CLIENTE\nSeñor(a) [NOMBRE], le confirmamos que hemos recibido correctamente el contrato firmado, el soporte de pago y la documentación requerida para iniciar.\nSu caso pasa ahora a gestión por parte de nuestro equipo. A partir de este momento avanzaremos con la etapa correspondiente ante la UPME y le informaremos cuando el caso haya sido creado y tengamos el número de radicado o cualquier novedad que requiera su intervención.\nMuchas gracias por la confianza. Continuaremos acompañándolo durante el proceso y estaremos atentos a sus inquietudes.\n↩ Volver al inicio\n\nNota interna para el agente: Este mensaje marca el cambio de responsabilidad entre Comercial y Back Office. Antes de enviarlo, valide que el expediente esté efectivamente completo.\n\nSecuencia recomendada de conversión\n\nPatrón operativo observado en los casos con avance positivo: factura recibida → validación preliminar → explicación breve del alcance y costo → solicitud de RUT/cédula → cliente confirma interés → envío de contrato → firma confirmada → instrucciones de pago → comprobante recibido → verificación de documentos → inicio de gestión UPME/DIAN.\n\n↩ Volver al inicio"}],"principios":{"titulo":"Principios de comunicación obligatorios (V4)","texto":"GÓMEZ LEGAL ABOGADOS S.A.S.\n\nAcceso rápido: Scripts de conversión basados en conversaciones con resultado positivo\n\nGUÍA COMPLETA DE\nPREGUNTAS Y RESPUESTAS\n\nAlianza SURA · Beneficios tributarios por vehículos eléctricos e híbridos\n\nCertificado UPME · Devolución del IVA ante la DIAN · Atención comercial y Back Office\n\n  Propósito                                         Unificar la forma de responder a clientes y mantener una comunicación cordial, precisa y consistente.\n  Tratamiento                                       Siempre de usted. No se tutea al cliente. No se utilizan emojis.\n\n  Uso                                               Respuestas listas para chat o como guía verbal en llamada. Reemplace siempre los textos entre corchetes.\n\n  Escalamiento                                      Los casos jurídicos especiales o con inconsistencias deben escalarse antes de cotizar, prometer o radicar.\n\nVersión preparada para operación · Octubre de 2026\n\nCómo usar esta guía\n\n• Use la respuesta sugerida como base. Puede adaptarla al contexto siempre que no cambie el sentido operativo o jurídico.\n\n• Mantenga un tono cordial, respetuoso y profesional. Diríjase al cliente de usted en toda la interacción.\n\n• No utilice emojis, expresiones coloquiales ni promesas absolutas sobre aprobación, tiempos o valor final de devolución.\n\n• Antes de responder sobre valores, valide la factura. Antes de responder sobre casos especiales, revise si corresponde escalamiento jurídico.\n\n• Las notas internas y las fuentes son únicamente para uso del agente; no deben copiarse al cliente.\n\nConsultas más frecuentes: acceso rápido\n\n  ›             ¿Cuánto me devuelven de IVA?\n  ›             ¿Cuánto vale el servicio?\n\n  ›             ¿Cuánto tarda todo el proceso?\n\n  ›             ¿Qué documentos necesito para iniciar?\n\n  ›             ¿Para qué sirve el certificado UPME?\n\n  ›             ¿Cómo funciona el proceso UPME → DIAN?\n\n  ›             ¿Cómo sé que esta gestión es legítima?\n\n  ›             Ya tengo certificado UPME\n\nÍndice por etapas\n\n1. Contacto inicial y cita\n\n2. Sondeo y validación del vehículo\n\n3. Explicación del beneficio y del proceso\n\n4. Cliente que ya cuenta con certificado UPME\n\n5. Costos y pagos\n\n6. Documentos\n\n7. Tiempos\n\n8. Casos especiales\n\n9. Objeciones y confianza\n\n10. Después de radicar y seguimiento\n\n11. Respuestas solo cuando el cliente pregunta\n\n12. Cierre\n\nPrincipios de comunicación obligatorios\n\n  Principio                                                                                           Regla operativa\n  Trato formal                                                                                        Use “usted”, “su”, “le”, “puede”, “prefiere”, “necesita”. No mezcle usted con tuteo dentro de la misma respuesta.\n\n  Precisión                                                                                           Diferencie siempre las funciones: UPME certifica; DIAN estudia la devolución; Gómez Legal estructura, radica, acompaña y hace seguimiento.\n\n  Expectativas                                                                                        Evite “garantizado”, “seguro”, “le van a devolver” o fechas exactas. Utilice “puede aplicar”, “sujeto al cumplimiento de requisitos” y “la decisión final corresponde a la entidad”.\n\n  Documentación                                                                                       La factura es el documento clave del primer contacto. Permite revisar elegibilidad, IVA y tarifa UPME.\n\n  Escalamiento                                                                                        Escalar: empresa, copropiedad, apoderado, RUT códigos 42/48, leasing a nombre de la entidad financiera, IVA 19 %, certificado UPME con errores u otra inconsistencia jurídica."}};const URL="https://daniela-servidor.onrender.com/api/conocimiento/lote";
