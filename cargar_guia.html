<script>const D={"guia":[{"titulo":"Etapa 1 (Contacto inicial y cita) · 01. Mensaje de apertura (primer contacto desde la agenda SURA)","texto":"Etapa 1 (Contacto inicial y cita) · 01. Mensaje de apertura (primer contacto desde la agenda SURA)\n\nRESPUESTA SUGERIDA AL CLIENTE\nBuenos días/tardes. Somos Gómez Legal Abogados, el equipo de asesoría en beneficios tributarios para vehículos eléctricos e híbridos, en alianza con SURA.\nNos comunicamos con usted porque adquirió un vehículo eléctrico o híbrido y podría tener derecho a la devolución del IVA que pagó en la compra.\nPara realizar una primera validación de su caso, ¿me confirma, por favor, la siguiente información?\n• Marca y modelo (línea exacta):\n• Fecha de compra:\n¿Lo compró nuevo o usado?\n¿La factura quedó a su nombre, a nombre de dos personas o de una empresa?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nGuion pactado con SURA (3 preguntas) + la pregunta de titularidad, que define la ruta del caso desde el primer mensaje. Registrar las respuestas en la ficha. Un carro usado o mild hybrid se descarta aquí mismo.\nFuente: Capacitación agentes (láminas 13-14) · Estructura de interacción §3"},{"titulo":"Etapa 1 (Contacto inicial y cita) · 02. Recordatorio de cita (5 minutos antes de la hora agendada)","texto":"Etapa 1 (Contacto inicial y cita) · 02. Recordatorio de cita (5 minutos antes de la hora agendada)\n\nRESPUESTA SUGERIDA AL CLIENTE\nBuenos días/tardes. Soy [nombre], consultor(a) de Gómez Legal Abogados, en representación de SURA.\nLe escribo para confirmar nuestra cita agendada para las [hora]. ¿Prefiere que conversemos por este medio o tiene disponibilidad para una llamada telefónica, en la que le explico el proceso para acceder a la devolución del IVA por parte de la DIAN?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEnviar 5 minutos antes de la hora de la agenda. Procurar que la comunicación se mantenga por WhatsApp. Si elige llamada: confirmar hora y pedirle que atienda un número no registrado.\nFuente: Estructura de interacción (recordatorio) · Script role play §1"},{"titulo":"Etapa 1 (Contacto inicial y cita) · 03. El cliente prefiere la llamada","texto":"Etapa 1 (Contacto inicial y cita) · 03. El cliente prefiere la llamada\n\nRESPUESTA SUGERIDA AL CLIENTE\nPerfecto, [nombre del cliente]. Me comunicaré con usted a las [hora].\nLe recomiendo estar pendiente, porque la llamada puede entrar desde un número que no tenga registrado en sus contactos. ¡Gracias!\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nConfirmar hora y nombre de la persona agendada.\nFuente: Script role play §1"},{"titulo":"Etapa 1 (Contacto inicial y cita) · 04. El cliente no contesta la llamada","texto":"Etapa 1 (Contacto inicial y cita) · 04. El cliente no contesta la llamada\n\nRESPUESTA SUGERIDA AL CLIENTE\nHola [nombre], intentamos comunicarnos con usted a la hora de nuestra cita y no logramos comunicarnos.\n¿Prefiere que continuemos por este medio o me indica otro horario para llamarte? Quedo atento(a).\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nIntentar la llamada una segunda vez; si no responde, volver a contactar por WhatsApp para confirmar canal y hora.\nFuente: Estructura de interacción (recordatorio)"},{"titulo":"Etapa 1 (Contacto inicial y cita) · 05. Apertura de la conversación con la persona agendada","texto":"Etapa 1 (Contacto inicial y cita) · 05. Apertura de la conversación con la persona agendada\n\nRESPUESTA SUGERIDA AL CLIENTE\nBuenos días/tardes, [nombre del cliente]. Le habla [nombre], consultor(a) de Gómez Legal Abogados, en representación de SURA.\nComo le confirmé por WhatsApp, el objetivo es explicarle el beneficio tributario que puede aplicar a la compra de su vehículo eléctrico o híbrido. ¿Dispone de aproximadamente 15 a 20 minutos para revisar su caso con calma?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nConfirmar identidad de la persona agendada antes de entrar en detalle. Si se hizo contacto previo por WhatsApp: \"hablamos hace un momento por este mismo medio\".\nFuente: Estructura de interacción §1 · Script role play §2"},{"titulo":"Etapa 1 (Contacto inicial y cita) · 06. Quien responde NO es la persona agendada por SURA","texto":"Etapa 1 (Contacto inicial y cita) · 06. Quien responde NO es la persona agendada por SURA\n\nRESPUESTA SUGERIDA AL CLIENTE\nGracias por atenderme. Para poder revisar el caso necesito hablar con el titular del vehículo (la persona a cuyo nombre quedó la factura) o contar con su autorización.\n¿tiene relación con el propietario y su autorización para gestionar el trámite y compartir su documentación? Si prefiere, agendamos directamente con él/ella.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nConfirmar relación y autorización del propietario. Si no la tiene, buscar una nueva agenda con el titular. El trámite siempre se hace a nombre del titular de la factura y el giro llega a la cuenta del titular.\nFuente: Estructura de interacción §1 (nota)"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 07. Preguntas de sondeo (secuencia completa)","texto":"Etapa 2 (Sondeo y validación del vehículo) · 07. Preguntas de sondeo (secuencia completa)\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara validar preliminarmente si su caso puede aplicar, le haré unas preguntas breves:\n1 ¿Ya compró el vehículo o todavía está evaluando la compra?\n2 ¿Es usted el primer propietario (lo compró nuevo en concesionario)?\n3 ¿Cuál es la marca, la línea exacta y el año modelo?\n4 ¿Es 100 % eléctrico, híbrido o híbrido enchufable?\n5 ¿Fecha de compra?\n6 ¿La factura quedó a su nombre como persona natural, a nombre de dos personas o de una empresa?\n7 ¿Tiene otro vehículo eléctrico o híbrido que también pueda aplicar?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCon las respuestas se valida: tecnología EV/HEV/PHEV, vehículo nuevo, factura de menos de 5 años y titular correcto. Si hay duda sobre si un vehículo aplica, consultar la Guía práctica de reconocimiento (MHEV/HEV/PHEV/BEV) y la Guía de referencia (listado por marca). Si no aplica, explicarlo con respeto y cerrar.\nFuente: Estructura de interacción §3 · Script role play §3 · Capacitación agentes lámina 13"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 08. El cliente dice «mi carro es híbrido» pero no sabe de qué tipo","texto":"Etapa 2 (Sondeo y validación del vehículo) · 08. El cliente dice «mi carro es híbrido» pero no sabe de qué tipo\n\nRESPUESTA SUGERIDA AL CLIENTE\nPerfecto. Para orientarlo correctamente necesito confirmar el tipo de híbrido, porque no todos aplican.\n¿Su vehículo tiene un puerto para conectarlo a una toma de corriente? Y en la ficha técnica o en la tarjeta de propiedad, ¿aparece como Hybrid / HEV, Plug-in / PHEV o Mild Hybrid / MHEV?\nSi no lo tiene claro, con una foto de la factura lo verifico yo.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRegla de oro: la palabra \"híbrido\" en la publicidad no es el criterio. Aplican EV/BEV, HEV (híbrido convencional), PHEV (enchufable) y REEV (Deepal). NO aplican los mild hybrid / microhíbridos de 12-48 V (Mazda CX-30 \"M Hybrid\", Suzuki Swift \"Hybrid\", Kia Stonic, Renault Arkana MHEV, Toyota Hilux 48 V). Los Nissan e-Power (X-Trail, Qashqai, Kicks) SÍ aplican. En la factura debe aparecer IVA del 5 %; si trae IVA 19 %, escalar a jurídico.\nFuente: Guía de referencia §2 · Guía práctica reconocimiento vehículos electrificados"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 09. El vehículo es mild hybrid (MHEV) o de combustión → NO aplica","texto":"Etapa 2 (Sondeo y validación del vehículo) · 09. El vehículo es mild hybrid (MHEV) o de combustión → NO aplica\n\nRESPUESTA SUGERIDA AL CLIENTE\nGracias por la información. Revisando la referencia, su vehículo es un microhíbrido (mild hybrid), es decir, un vehículo de combustión con asistencia eléctrica que no puede moverse solo con el motor eléctrico.\nLamentablemente esa tecnología no está cubierta por el incentivo de la Ley 1715, así que en este caso no podríamos gestionar la devolución del IVA.\nSi más adelante adquiere un vehículo 100 % eléctrico, híbrido o híbrido enchufable, con gusto le acompañaremos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCerrar el contacto con respeto y registrar \"no aplica – MHEV\". Si hay duda razonable (la ficha técnica no es concluyente), pedir foto de la factura y la licencia de tránsito (campo \"combustible\": ELECTRICO / HIBRIDO) y escalar a jurídico antes de descartar.\nFuente: Guía de referencia §2.1 · Guía práctica reconocimiento §5-6"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 10. El vehículo es usado / el cliente no es el primer comprador → NO aplica","texto":"Etapa 2 (Sondeo y validación del vehículo) · 10. El vehículo es usado / el cliente no es el primer comprador → NO aplica\n\nRESPUESTA SUGERIDA AL CLIENTE\nGracias por la información. El beneficio de devolución del IVA aplica únicamente para vehículos nuevos facturados por el concesionario o importador a nombre del comprador, porque lo que se devuelve es el IVA que pagó ese primer comprador.\nComo en su caso el vehículo fue adquirido usado, no es posible gestionar la devolución. Si en el futuro compra un eléctrico o híbrido nuevo, puede contar con nosotros.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSeñal de alerta \"NO aplica\". Lo mismo si la factura está a nombre de otra persona (el cliente no fue quien compró).\nFuente: Capacitación agentes lámina 11 · Guía de referencia §2.1"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 11. La factura tiene más de 5 años (o está a menos de 30 días de cumplirlos)","texto":"Etapa 2 (Sondeo y validación del vehículo) · 11. La factura tiene más de 5 años (o está a menos de 30 días de cumplirlos)\n\nRESPUESTA SUGERIDA AL CLIENTE\nGracias por la información. La devolución del IVA se puede solicitar dentro de los 5 años siguientes a la fecha de la factura. ⏳\nEn su caso ese plazo [ya se cumplió / está a punto de cumplirse], y como el trámite tiene dos etapas (UPME y DIAN) que toman varias semanas, no es responsable iniciarlo ahora: no alcanzaríamos a radicar a tiempo.\nSi tiene otro vehículo eléctrico o híbrido más reciente, con gusto lo revisamos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nPlazo: 5 años desde la fecha de la factura (art. 1.6.1.21.22 / 1.6.1.21.27 Dcto. 1625/2016; art. 2536 C.C.). Regla SURA: si faltan menos de 30 días para el vencimiento de los 5 años, no se recomienda iniciar. Casos límite: escalar a jurídico antes de cerrar.\nFuente: Estructura de interacción §3 · Guía de referencia §1.1"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 12. El cliente todavía no ha comprado el vehículo","texto":"Etapa 2 (Sondeo y validación del vehículo) · 12. El cliente todavía no ha comprado el vehículo\n\nRESPUESTA SUGERIDA AL CLIENTE\nEs positivo que lo esté evaluando con anticipación. Este beneficio se gestiona una vez tenga la factura del vehículo a su nombre.\nDos recomendaciones para que pueda acceder al beneficio:\nQue sea un vehículo nuevo, 100 % eléctrico, híbrido o híbrido enchufable (los mild hybrid no aplican).\nQue la factura quede a su nombre y con el IVA del 5 % discriminado.\nCuando lo compre, escríbanos con la factura y arrancamos de inmediato.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nNo se cierra como \"no aplica\": queda como prospecto para seguimiento. Registrar en el CRM con fecha estimada de compra.\nFuente: Estructura de interacción §3"},{"titulo":"Etapa 2 (Sondeo y validación del vehículo) · 13. El caso cumple preliminarmente (transición a la explicación)","texto":"Etapa 2 (Sondeo y validación del vehículo) · 13. El caso cumple preliminarmente (transición a la explicación)\n\nRESPUESTA SUGERIDA AL CLIENTE\nPerfecto. Con la información que me proporciona, su caso cumple preliminarmente con los criterios del beneficio.\nLa validación definitiva la realizamos con la documentación, principalmente con la factura de compra. ¿Me permite explicarle en qué consiste el beneficio y cómo es el proceso?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nPasar a la explicación del beneficio. No prometer nada antes de ver la factura.\nFuente: Script role play §3"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 14. Introducción del beneficio (qué es y por qué existe)","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 14. Introducción del beneficio (qué es y por qué existe)\n\nRESPUESTA SUGERIDA AL CLIENTE\nPor haber comprado un vehículo eléctrico o híbrido nuevo, la ley (Ley 1715 de 2014) le permite solicitar que la DIAN le devuelva el IVA que pagó en la compra: es el 5 % del valor del vehículo sin IVA, y va directo a su cuenta bancaria.\n¿Por qué se cobró inicialmente? Porque el concesionario factura con IVA antes de que exista el certificado de la UPME. Con ese certificado, ese IVA pasa a ser un «pago de lo no debido» y la DIAN lo devuelve.\nAdemás, con el mismo certificado, el 50 % del valor del vehículo se puede deducir en su declaración de renta hasta por 15 años.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nVender los DOS beneficios: devolución del IVA (5 %) y deducción del 50 % en renta. NO hablar de impuesto vehicular reducido ni de depreciación acelerada. El impuesto al consumo (INC) de algunos híbridos NO se devuelve.\nFuente: Capacitación agentes láminas 2-3 · Guía de referencia §1 y §3"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 15. Explicación del proceso paso a paso","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 15. Explicación del proceso paso a paso\n\nRESPUESTA SUGERIDA AL CLIENTE\nLe explico el proceso paso a paso para que tenga total claridad:\n1. Revisamos su vehículo, la factura y las condiciones de la compra.\n2. Gestionamos ante la UPME (Unidad de Planeación Minero Energética) el certificado que acredita que su vehículo cumple los requisitos del incentivo. Nosotros creamos el caso, cargamos la documentación y hacemos seguimiento.\n3. Con el certificado y la documentación completa, preparamos y radicamos la solicitud de devolución ante la DIAN (incluida la cita, si su seccional la exige) y hacemos seguimiento hasta que el dinero llegue a su cuenta.\nEl proceso tiene dos pagos: la tarifa oficial de la UPME por el certificado (la fija la entidad en UVT según el valor del vehículo) y nuestros honorarios por la gestión integral. Le explico ambos en detalle.\nNuestro trabajo es que no tenga que gestionar por su cuenta las diferentes etapas ante la UPME y la DIAN, ni los documentos y requisitos asociados: estructuramos y acompañamos el proceso de principio a fin.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCinco ideas en este orden (pactadas con SURA): revisión, gestión UPME, para qué sirve el certificado, costo en UVT, gestión DIAN y seguimiento. Cerrar pidiendo la foto de la factura.\nFuente: Capacitación agentes lámina 15 · Estructura de interacción §4"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 16. Cierre de la explicación: pedir la factura","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 16. Cierre de la explicación: pedir la factura\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara indicarle el valor exacto de la tarifa de la UPME y indicarle cuánto IVA podría solicitar en devolución, envíeme, por favor, una foto o el PDF de la factura de compra de su vehículo.\nNormalmente la factura electrónica le llegó al correo desde el concesionario. Con ella verifico la información del vehículo y le confirmo los siguientes pasos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nLa factura es la pieza clave del primer contacto: da el valor sin IVA (tarifa UPME por rangos) y el IVA pagado (monto a devolver). Pedirla siempre antes de cotizar.\nFuente: Capacitación agentes lámina 15"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 17. ¿Para qué sirve el certificado de la UPME?","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 17. ¿Para qué sirve el certificado de la UPME?\n\nRESPUESTA SUGERIDA AL CLIENTE\nEl certificado de la UPME es la llave de todo el proceso. Es el documento que acredita ante la DIAN que su vehículo cumple los requisitos de la Ley 1715 y, por lo tanto, que el IVA que pagó no se debía.\nSin ese certificado no hay devolución del IVA, y además es el mismo documento que soporta la deducción del 50 % del valor del vehículo en su declaración de renta.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nUPME = Unidad de Planeación Minero Energética (entidad adscrita al Ministerio de Minas y Energía). El certificado no tiene fecha de vencimiento (Res. UPME 135/2025).\nFuente: Estructura de interacción §5 · Guía de referencia §6.4 y glosario"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 18. ¿Quién aprueba la devolución? ¿Gómez Legal?","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 18. ¿Quién aprueba la devolución? ¿Gómez Legal?\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo: nosotros no aprobamos ni recibimos el dinero. Gómez Legal Abogados revisa, estructura, registra, radica, acompaña y hace seguimiento al proceso.\nLa UPME es la entidad que expide el certificado, y la DIAN es la entidad que estudia la solicitud de devolución, emite la resolución y gira el dinero directamente a su cuenta bancaria.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCorregir con tacto las confusiones frecuentes: la UPME NO devuelve el IVA (expide el certificado); la DIAN NO expide el certificado (devuelve el IVA); Gómez Legal NO decide.\nFuente: Script role play §4 y §14"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 19. ¿Cuánto me devuelven de IVA?","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 19. ¿Cuánto me devuelven de IVA?\n\nRESPUESTA SUGERIDA AL CLIENTE\nEl valor depende del IVA que haya pagado en la compra: es el 5 % del valor del vehículo sin IVA, tal como aparece discriminado en la factura, siempre que su caso cumpla todos los requisitos.\nPor eso prefiero no indicarle una cifra aproximada sin revisar su documentación. Envíeme una foto de la factura y le indico el valor exacto que podría solicitar en devolución.\nTenga en cuenta que solo se devuelve el IVA del vehículo: el impuesto al consumo (si su vehículo lo tiene) y el IVA de accesorios o planes de mantenimiento no hacen parte de la devolución.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEjemplos reales para dimensionar (sin prometer): carro de $200 M sin IVA → $10 M; Tesla Model Y ($114,3 M) → $5,7 M; Corolla Cross HEV ($132,7 M) → $6,6 M; BYD Seagull ($80,9 M) → $4 M. El valor se COPIA de la factura, nunca se calcula. El INC (8 % o 16 %) NO se devuelve.\nFuente: Respuesta pactada SURA · Guía de referencia §3"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 20. ¿Hay otro beneficio además de la devolución del IVA?","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 20. ¿Hay otro beneficio además de la devolución del IVA?\n\nRESPUESTA SUGERIDA AL CLIENTE\nSí. Con el mismo certificado de la UPME, el 50 % del valor del vehículo (sin IVA) se puede deducir en su declaración de renta, en el año de la compra o repartido hasta en 15 años (cada año hasta el 50 % de su renta líquida).\nPor ejemplo: un vehículo de $200.000.000 permite deducir $100.000.000. Esta parte la aplica su contador en la declaración de renta, con el certificado y la factura como soporte.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nArt. 11 Ley 1715/2014 (mod. art. 8 Ley 2099/2021). Es independiente de la devolución del IVA; no la hace el agente. Argumento de venta fuerte para quienes declaran renta.\nFuente: Capacitación agentes lámina 3 · Guía de referencia §1"},{"titulo":"Etapa 3 (Explicación del beneficio y del proceso) · 21. ¿Qué es la UPME?","texto":"Etapa 3 (Explicación del beneficio y del proceso) · 21. ¿Qué es la UPME?\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa UPME es la Unidad de Planeación Minero Energética, una entidad del Gobierno (adscrita al Ministerio de Minas y Energía).\nEs la encargada de certificar que un vehículo eléctrico o híbrido cumple los requisitos de la Ley 1715 para acceder a los incentivos tributarios. Ese certificado es el que luego presentamos ante la DIAN.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nPronunciar completo el nombre de la entidad al menos una vez en la conversación.\nFuente: Guía de referencia glosario · Script role play §5"},{"titulo":"Etapa 4 (Cliente que ya cuenta con certificado UPME) · 22. Ya tengo el certificado UPME","texto":"Etapa 4 (Cliente que ya cuenta con certificado UPME) · 22. Ya tengo el certificado UPME\n\nRESPUESTA SUGERIDA AL CLIENTE\nPerfecto. Entonces ya tiene el documento fundamental para continuar.\nAhora debemos revisar el certificado UPME junto con la factura de compra: verificamos que el nombre, la cédula, el vehículo y el valor coincidan exactamente, porque la DIAN cruza esa información y cualquier diferencia hace que inadmitan la solicitud.\nEnvíeme, por favor, una foto o el PDF del certificado UPME y de la factura, y le indico cómo continuamos directamente con la etapa de la DIAN.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRevisar dígito por dígito: cédula/NIT del beneficiario = RUT; nombre completo como en el RUT; valor sin IVA = base gravable de la factura; marca, línea, año y proveedor = factura. Si algo no coincide, se pide corrección a la UPME ANTES de radicar (escalar a jurídico).\nFuente: Respuesta pactada SURA · Guía de referencia §6.4"},{"titulo":"Etapa 4 (Cliente que ya cuenta con certificado UPME) · 23. ¿Cuánto cuesta el servicio si ya tengo el certificado UPME?","texto":"Etapa 4 (Cliente que ya cuenta con certificado UPME) · 23. ¿Cuánto cuesta el servicio si ya tengo el certificado UPME?\n\nRESPUESTA SUGERIDA AL CLIENTE\nEn ese caso solo gestionamos la etapa de la DIAN: preparamos el Formulario 010, la solicitud, la relación de facturas y la declaración, agendamos la cita (si su seccional la exige), radicamos y hacemos seguimiento hasta el giro.\nPor ser cliente SURA, el valor de esa gestión es de $300.000 + IVA ($357.000 IVA incluido), pago único.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSolo procedimiento DIAN: $300.000 + IVA. La cita DIAN va incluida; nunca se vende sola.\nFuente: Estructura de interacción §5 · Script role play §11 · Guía de referencia §1.1"},{"titulo":"Etapa 4 (Cliente que ya cuenta con certificado UPME) · 24. El certificado UPME tiene un error (cédula, nombre o valor distinto)","texto":"Etapa 4 (Cliente que ya cuenta con certificado UPME) · 24. El certificado UPME tiene un error (cédula, nombre o valor distinto)\n\nRESPUESTA SUGERIDA AL CLIENTE\nGracias por enviarlo. Al revisarlo encontré que [la cédula / el nombre / el valor del vehículo] no coincide exactamente con [su RUT / la factura].\nEs importante corregirlo antes de radicar en la DIAN, porque la entidad cruza esos datos y una diferencia mínima causa la inadmisión de la solicitud. Nosotros le orientamos para pedir la corrección a la UPME y, una vez corregido, continuamos con la DIAN.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEscalar a jurídico. La corrección se pide desde el mismo caso en la plataforma (recurso de reposición dentro de los 10 días hábiles) o por correspondencia@upme.gov.co. Nunca radicar en la DIAN con un certificado con errores.\nFuente: Capacitación back office lámina 26 · Guía de referencia §5.5"},{"titulo":"Etapa 5 (Costos y pagos) · 25. ¿Cuánto vale el servicio? (proceso completo)","texto":"Etapa 5 (Costos y pagos) · 25. ¿Cuánto vale el servicio? (proceso completo)\n\nRESPUESTA SUGERIDA AL CLIENTE\nEl proceso contempla dos pagos diferentes:\n1 Nuestros honorarios. Por ser cliente de SURA, usted tiene una tarifa preferencial de $600.000 + IVA ($714.000 IVA incluido). Es un pago único por la gestión integral ante la UPME y la DIAN, incluyendo cita, radicación, acompañamiento y seguimiento jurídico hasta el giro.\n2 La tarifa oficial de la UPME por la expedición del certificado. La fija la entidad en UVT según el valor del vehículo; no está incluida en nuestros honorarios y corresponde directamente al trámite ante la UPME.\nSi me comparte la factura, le indico el valor exacto de la tarifa UPME y le explico el proceso completo antes de iniciar.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nTarifa SURA: $600.000 + IVA = $714.000. Fee POR CARRO. La tarifa UPME va aparte (la mayoría de carros: 13,4 UVT = $701.812 en 2026). La DIAN no cobra nada.\nFuente: Respuesta pactada SURA · Estructura de interacción §5 · Capacitación agentes lámina 5"},{"titulo":"Etapa 5 (Costos y pagos) · 26. ¿Cuánto vale el certificado de la UPME?","texto":"Etapa 5 (Costos y pagos) · 26. ¿Cuánto vale el certificado de la UPME?\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa tarifa la fija la UPME por rangos, según el valor del vehículo SIN IVA, y se expresa en UVT (en 2026 la UVT vale $52.374):\n• Hasta $14,4 M → 1,2 UVT ($62.849)\n• De $14,4 M a $43,3 M → 3,4 UVT ($178.072)\n• De $43,3 M a $86,5 M → 6,7 UVT ($350.906)\n• De $86,5 M a $173,1 M → 13,4 UVT ($701.812) ← la mayoría de los vehículos\n• Más de $173,1 M → la UPME aplica una fórmula (la calculamos con la factura)\nCon la foto de su factura le confirmo el valor exacto. Este pago no se reembolsa aunque el certificado no se apruebe, por eso revisamos todo antes de pagar.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nArt. 13 Res. UPME 135/2025. Usar SIEMPRE la calculadora oficial antes de cotizar: https://app.upme.gov.co/Calculadora/CalculadoraIT.html (digitar la base gravable de la factura, sin IVA ni INC). Con varios carros se usa la suma de los valores sin IVA (un solo certificado). Actualizar los pesos cada año con la UVT vigente.\nFuente: Guía de referencia §6.2 · Capacitación agentes lámina 7"},{"titulo":"Etapa 5 (Costos y pagos) · 27. ¿Los $714.000 son mensuales?","texto":"Etapa 5 (Costos y pagos) · 27. ¿Los $714.000 son mensuales?\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo . Es un pago único por todo el proceso: cubre la gestión ante la UPME, la preparación y radicación ante la DIAN, la cita, el acompañamiento y el seguimiento hasta que reciba el giro.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nAclarar siempre \"pago único\".\nFuente: Script role play §6"},{"titulo":"Etapa 5 (Costos y pagos) · 28. ¿Cuándo y cómo pago los honorarios?","texto":"Etapa 5 (Costos y pagos) · 28. ¿Cuándo y cómo pago los honorarios?\n\nRESPUESTA SUGERIDA AL CLIENTE\nLos honorarios se pagan al momento de aceptar el servicio. Le enviamos por WhatsApp el enlace de pago y el contrato de prestación de servicios de Gómez Legal Abogados.\nUna vez realizado el pago, nos responde por este mismo canal con la documentación completa (se la detallo enseguida) dentro de las siguientes 24 horas, para iniciar la gestión ante la UPME.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRegla SURA: honorarios al aceptar el servicio; documentos dentro de las 24 horas siguientes al pago. Todo pago debe quedar soportado (comprobante). Se canaliza a través de la empresa.\nFuente: Estructura de interacción §5-6 · Script role play §6 y §10"},{"titulo":"Etapa 5 (Costos y pagos) · 29. ¿Cuándo y cómo se paga la tarifa de la UPME?","texto":"Etapa 5 (Costos y pagos) · 29. ¿Cuándo y cómo se paga la tarifa de la UPME?\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa tarifa de la UPME se paga cuando ya tenemos su caso creado en la plataforma de la entidad y aparece la liquidación exacta. Tiene dos opciones:\nQue la paguemos por usted: le enviamos el enlace de pago (Wompi) o, si prefiere tarjeta de crédito, se adiciona un 2 % al valor liquidado por la UPME.\nPagarla directamente a la UPME: le enviamos el paso a paso; tiene 24 horas desde que recibe las instrucciones y nos envía el soporte de pago por WhatsApp.\nAmbos pagos (honorarios y tarifa UPME) son necesarios para que la solicitud quede radicada en la UPME.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nConcepto de pago en la UPME: CERTIFICADOS GEE (Wompi). Si el pago falla, esperar 20 minutos antes de reintentar. La tarifa NO se devuelve aunque el certificado no se apruebe: revisar datos antes de pagar. Registrar en el CRM si la tarifa la pagó el cliente o el BPO.\nFuente: Estructura de interacción §5 · Script role play §6 · Capacitación back office lámina 23"},{"titulo":"Etapa 5 (Costos y pagos) · 30. ¿Puedo pagar con tarjeta de crédito?","texto":"Etapa 5 (Costos y pagos) · 30. ¿Puedo pagar con tarjeta de crédito?\n\nRESPUESTA SUGERIDA AL CLIENTE\nClaro. Los honorarios los puede pagar por el enlace que le enviamos (incluye tarjeta de crédito).\nPara la tarifa de la UPME también ofrecemos pago con tarjeta de crédito; en ese caso se adiciona un 2 % al valor liquidado por la entidad. Si prefiere evitarlo, puede pagarla directamente a la UPME con el paso a paso que le enviamos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEl 2 % aplica solo al pago de la tarifa UPME con tarjeta de crédito a través de la firma.\nFuente: Estructura de interacción §5 · Script role play §6"},{"titulo":"Etapa 5 (Costos y pagos) · 31. ¿Ustedes reciben el dinero de la devolución y me lo transfieren?","texto":"Etapa 5 (Costos y pagos) · 31. ¿Ustedes reciben el dinero de la devolución y me lo transfieren?\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo . La devolución la gira la DIAN directamente a la cuenta bancaria que está a su nombre (la de la certificación bancaria que presentamos).\nGómez Legal Abogados no recibe ni administra ese dinero en ningún momento; nosotros gestionamos el trámite y hacemos seguimiento hasta que veas el giro en su cuenta.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nGiro únicamente a cuenta del titular (nunca a terceros ni en efectivo). Con copropiedad, a la cuenta del apoderado indicada en el poder.\nFuente: Script role play §7 · Guía de referencia §3 (reglas de valores)"},{"titulo":"Etapa 5 (Costos y pagos) · 32. ¿Tengo varios carros? ¿Cuánto pagaría?","texto":"Etapa 5 (Costos y pagos) · 32. ¿Tengo varios carros? ¿Cuánto pagaría?\n\nRESPUESTA SUGERIDA AL CLIENTE\n¡Buena noticia! Si tiene varios vehículos eléctricos o híbridos que cumplen, se pide UN solo certificado UPME que los ampare todos, así paga una sola tarifa UPME (calculada sobre la suma de los valores sin IVA).\nAnte la DIAN se presenta una solicitud por cada vehículo (por cada factura), y por eso nuestros honorarios se cobran por vehículo: $600.000 + IVA cada uno.\nEnvíeme las facturas de todos y le indico la cotización exacta.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nUn certificado UPME = una tarifa UPME. DIAN: una solicitud por factura. Fee de la firma por carro ($600.000 + IVA cada uno para SURA). Jurídico confirma caso por caso cómo se arman las solicitudes.\nFuente: Guía de referencia §5.4 · Capacitación agentes láminas 4-5"},{"titulo":"Etapa 6 (Documentos) · 33. ¿Qué documentos necesito para iniciar? (persona natural)","texto":"Etapa 6 (Documentos) · 33. ¿Qué documentos necesito para iniciar? (persona natural)\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara iniciar la gestión ante la UPME necesitamos:\n• RUT actualizado (generado hace menos de 30 días, con su dirección, correo y teléfono vigentes)\n• Factura electrónica de compra del vehículo (en PDF, con el IVA discriminado)\n• Cédula por ambas caras (foto nítida o PDF)\n• Contraseñas de los PDF, si vienen protegidos (casi siempre es su número de cédula)\n• Comprobante del pago de honorarios y el contrato de servicios aceptado\nLa certificación bancaria se la solicitaremos más adelante, cuando el paquete esté listo para radicar en la DIAN, porque solo tiene 30 días de vigencia.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nAl cliente solo se le piden RUT, factura, cédula y contraseñas para arrancar. Si el RUT trae códigos 48 (responsable de IVA) o 42 (obligado a contabilidad) en la casilla 53, pedir además tarjeta profesional y cédula del contador para el paquete DIAN. Verificar que el RUT no diga \"EN TRÁMITE\" ni \"BORRADOR\" (en la conversación se dice simplemente \"RUT actualizado\").\nFuente: Estructura de interacción §6 · Capacitación agentes lámina 10 · Guía de referencia §4.1"},{"titulo":"Etapa 6 (Documentos) · 34. ¿Qué documentos necesito? (vehículo a nombre de una empresa)","texto":"Etapa 6 (Documentos) · 34. ¿Qué documentos necesito? (vehículo a nombre de una empresa)\n\nRESPUESTA SUGERIDA AL CLIENTE\nComo el vehículo está a nombre de la empresa, la solicitante es la sociedad y el trámite lo firma el representante legal. Para iniciar necesitamos:\n• RUT de la empresa actualizado (menos de 30 días)\n• Factura electrónica a nombre de la empresa\nCertificado de existencia y representación legal (Cámara de Comercio, menos de 30 días)\n• Cédula del representante legal\n• Contraseñas de los PDF\n• Comprobante de pago y contrato aceptado\nPara la etapa de la DIAN necesitaremos además la certificación bancaria de la empresa y la tarjeta profesional y cédula del contador público (o del revisor fiscal, si la empresa está obligada a tenerlo), quien firma las certificaciones.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRuta D → escalar SIEMPRE a jurídico. El contador no puede ser el mismo representante legal. S.A. y S.C.A. siempre firma el revisor fiscal; S.A.S. solo si supera topes o lo dicen los estatutos (Concepto DIAN 000057/2025). La cita DIAN se agenda en la fila \"Persona Jurídica\". Contraseña UPME empresa = primera palabra de la razón social + 2026.\nFuente: Estructura de interacción §6 · Guía de referencia §4.2 (ruta D) · Guía IVAuto paso 2-B"},{"titulo":"Etapa 6 (Documentos) · 35. ¿Qué documentos necesito para el trámite de la DIAN?","texto":"Etapa 6 (Documentos) · 35. ¿Qué documentos necesito para el trámite de la DIAN?\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara radicar la solicitud ante la DIAN el paquete lleva:\nFactura de compra del vehículo\n• RUT actualizado\nCertificado UPME\nCertificación bancaria (cuenta a su nombre, expedida hace menos de 30 días)\nCopia de la cédula\nSi está obligado a llevar contabilidad o el vehículo está a nombre de una empresa, también necesitamos copia de la tarjeta profesional del contador.\nLos demás documentos (Formulario 010, solicitud, relación de facturas y declaración) los preparamos nosotros y solo tendrás que firmarlos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRespuesta textual pactada con SURA. Detectar 42/48 en la casilla 53 del RUT. La certificación bancaria se pide solo cuando el paquete esté listo.\nFuente: Respuesta pactada SURA · Capacitación agentes lámina 17"},{"titulo":"Etapa 6 (Documentos) · 36. ¿Por qué el RUT tiene que ser reciente / actualizado?","texto":"Etapa 6 (Documentos) · 36. ¿Por qué el RUT tiene que ser reciente / actualizado?\n\nRESPUESTA SUGERIDA AL CLIENTE\nPorque el RUT es la fuente de todos los datos del trámite: nombre, cédula, dirección, correo y teléfono. La DIAN cruza esa información con el certificado UPME y con la solicitud, y cualquier diferencia (hasta un correo o una abreviatura distinta) es causal de inadmisión.\nAdemás, la solicitud debe enviarse desde el correo que aparece en su RUT. Por eso le pedimos un RUT generado recientemente y con sus datos al día.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSi el RUT está desactualizado, el cliente debe actualizarlo en dian.gov.co (Usuario registrado) ANTES de radicar. Si cambió de dirección después del certificado UPME, jurídico prepara una carta de aclaración de diferencia de dirección.\nFuente: Script role play §10 · Guía de referencia §4.1 y §10.3"},{"titulo":"Etapa 6 (Documentos) · 37. El cliente no tiene RUT o lo tiene desactualizado","texto":"Etapa 6 (Documentos) · 37. El cliente no tiene RUT o lo tiene desactualizado\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo le preocupes . [Si no tiene RUT:] El RUT es indispensable para el trámite; se obtiene en línea en dian.gov.co o con cita en la DIAN, y le orientamos para hacerlo.\n[Si está desactualizado:] Necesitamos que lo actualices en dian.gov.co (ingresando como usuario registrado) con su dirección, correo y teléfono actuales, y luego nos envíes el PDF nuevo. Es un paso corto, pero evita que la DIAN inadmita la solicitud.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nNunca radicar sin el RUT. Si al actualizar aparece \"EN TRÁMITE\", debe terminar el proceso hasta que quede formalizado. Escalar a jurídico si el cliente no logra actualizarlo.\nFuente: Guía de referencia §5.5 y §10.3"},{"titulo":"Etapa 6 (Documentos) · 38. El cliente no encuentra la factura","texto":"Etapa 6 (Documentos) · 38. El cliente no encuentra la factura\n\nRESPUESTA SUGERIDA AL CLIENTE\nTranquilo . La factura electrónica del vehículo normalmente llega al correo que diste en el concesionario, desde una dirección de facturación electrónica. Busca por el nombre del concesionario o por «factura electrónica».\nSi no la encuentras, puede solicitarle al concesionario que se la reenvíe (la factura electrónica de venta, en PDF). Sin la factura no podemos validar el caso ni calcular la tarifa UPME.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nLa factura debe traer IVA 5 % discriminado, base gravable y CUFE. Una factura anulada por nota crédito y refacturada: se usa la vigente y su fecha.\nFuente: Estructura de interacción §3 · Guía de referencia §5.5"},{"titulo":"Etapa 6 (Documentos) · 39. Los PDF piden contraseña","texto":"Etapa 6 (Documentos) · 39. Los PDF piden contraseña\n\nRESPUESTA SUGERIDA AL CLIENTE\nEs normal: el RUT y la factura suelen venir protegidos. La contraseña casi siempre es su número de cédula (sin puntos); en algunos casos es «1».\nSi no abre con ninguna de las dos, envíeme la contraseña que le dio la entidad o el concesionario, por favor. Sin poder abrirlos no puedo revisar sus datos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nProbar cédula sin puntos y \"1\". Nunca radicar sin el RUT legible.\nFuente: Guía de referencia §4.1 y §5.5"},{"titulo":"Etapa 6 (Documentos) · 40. ¿Qué debe cumplir la certificación bancaria / la cuenta?","texto":"Etapa 6 (Documentos) · 40. ¿Qué debe cumplir la certificación bancaria / la cuenta?\n\nRESPUESTA SUGERIDA AL CLIENTE\nCuando el paquete esté listo para radicar le solicitaré la certificación bancaria. Debe cumplir:\n• Cuenta de ahorros o corriente a su nombre (la DIAN gira solo al titular)\n• Expedida hace menos de 30 días\n• Banco con convenio con la DIAN (Bancolombia, Davivienda, Banco de Bogotá, BBVA, Occidente, Popular, Agrario, AV Villas, Caja Social, Davibank, GNB Sudameris, Citibank, Itaú; Nu Colombia se ha aceptado)\n• No puede ser la cuenta donde recibe mesada pensional\nPuede descargarla desde la app o el portal de su banco en un minuto.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nNombre EXACTO del banco (Davivienda \"Fijo diario\"/\"Damas\" con nombre completo; Nu Colombia = \"Nu Colombia Compañía de Financiamiento S.A.\"), número exacto (BBVA: 16 dígitos), tipo correcto. Confirmar lista vigente en el portal DIAN. Pedirla SOLO cuando el paquete esté listo y radicar dentro de los 30 días.\nFuente: Guía de referencia §4.1 y §4.4"},{"titulo":"Etapa 6 (Documentos) · 41. ¿Qué documentos tengo que firmar? ¿Necesito notaría?","texto":"Etapa 6 (Documentos) · 41. ¿Qué documentos tengo que firmar? ¿Necesito notaría?\n\nRESPUESTA SUGERIDA AL CLIENTE\nUsted únicamente firma cuatro documentos que preparamos nosotros: el Formulario 010, la solicitud, la relación de facturas y la declaración juramentada.\nNo necesita notaría ni contador: como persona natural, la declaración juramentada la firma usted y reemplaza la certificación de contador (así lo aceptó la DIAN en el Concepto 000673 de 2026).\nLo único que pide la DIAN es que la firma sea visible: a mano y escaneada (lapicero negro) o dibujada sobre el PDF. Las firmas electrónicas invisibles las inadmiten.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nPersona natural no obligada a contabilidad (solo códigos 05/49 en el RUT): juramentada sin notaría. Notaría SOLO cuando el carro está a nombre de dos personas (poder). Empresa u obligado a contabilidad: firma también el contador/revisor fiscal.\nFuente: Guía de referencia §7.5 y §10.1 · Capacitación back office lámina 27"},{"titulo":"Etapa 6 (Documentos) · 42. ¿Necesito contador?","texto":"Etapa 6 (Documentos) · 42. ¿Necesito contador?\n\nRESPUESTA SUGERIDA AL CLIENTE\nSi usted es persona natural y no está obligado a llevar contabilidad (el caso más común), no necesita contador para la devolución del IVA: firmas una declaración juramentada sin notaría.\nSi en su RUT aparece como responsable de IVA u obligado a llevar contabilidad, o si el vehículo está a nombre de una empresa, sí: el contador (o revisor fiscal) firma las certificaciones y anexamos su tarjeta profesional.\nPara la deducción del 50 % en renta sí conviene que su contador la aplique en su declaración.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCódigos casilla 53 del RUT: 05 renta · 49 no responsable de IVA · 48 responsable de IVA · 42 obligado a contabilidad · 47 Simple · 52 facturador electrónico. 47 o 52 solos NO obligan a contabilidad. Con 42/48 → pedir tarjeta profesional del contador y escalar.\nFuente: Guía de referencia §4.2 y §10.1"},{"titulo":"Etapa 6 (Documentos) · 43. ¿Cómo les envío los documentos?","texto":"Etapa 6 (Documentos) · 43. ¿Cómo les envío los documentos?\n\nRESPUESTA SUGERIDA AL CLIENTE\nPor este mismo chat de WhatsApp está perfecto. Envíeme los PDF (o fotos nítidas) del RUT, la factura y su cédula por ambas caras, junto con las contraseñas si vienen protegidos.\nRecuerde que necesitamos la documentación completa dentro de las 24 horas siguientes al pago para iniciar la gestión ante la UPME. ¡Gracias!\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEn chat se piden directamente en la conversación; en llamada, indicar el canal (WhatsApp) para recibirlos. Registrar el avance en el CRM: \"Cliente acepta – pago realizado – pendiente documentos\".\nFuente: Estructura de interacción §6 y diferencias llamada/chat"},{"titulo":"Etapa 7 (Tiempos) · 44. ¿Cuánto se demora el certificado UPME?","texto":"Etapa 7 (Tiempos) · 44. ¿Cuánto se demora el certificado UPME?\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa UPME tiene hasta 30 días hábiles para la etapa de evaluación, contados desde que la solicitud está completa y pasa a evaluación. ⏱\nEn la práctica los tiempos han mejorado bastante y muchos certificados están saliendo en cerca de una semana hábil. Si la UPME pide un documento adicional o una aclaración, el plazo se suspende mientras respondemos.\nPor eso nosotros revisamos y radicamos la documentación completa y correcta desde el inicio: así evitamos requerimientos y reprocesos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRes. UPME 135/2025 art. 6: revisión de completitud 10 días hábiles + evaluación hasta 30 días hábiles; los requerimientos suspenden el plazo. Ventana de radicación UPME: 1 de febrero a 15 de diciembre (Res. 000400/2026). Fuera de esa ventana la solicitud se tiene por no presentada.\nFuente: Respuesta pactada SURA · Guía de referencia §1.1 y §9.4"},{"titulo":"Etapa 7 (Tiempos) · 45. ¿Cuánto se demora el trámite en la DIAN?","texto":"Etapa 7 (Tiempos) · 45. ¿Cuánto se demora el trámite en la DIAN?\n\nRESPUESTA SUGERIDA AL CLIENTE\nUna vez la solicitud queda debidamente radicada, la DIAN tiene hasta 50 días hábiles para resolverla (artículo 855 del Estatuto Tributario). En calendario, eso suele ser entre 2 y 3 meses.\nNosotros preparamos y radicamos la solicitud correctamente y hacemos seguimiento durante todo ese tiempo. Lo importante: el plazo empieza a contar desde el número de radicado.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSon días HÁBILES (no calendario). Si la DIAN inadmite, se corrige, se radica de nuevo y el plazo vuelve a correr. Nunca prometer fecha exacta de giro.\nFuente: Guía de referencia §1.1 y §8.3 · Capacitación back office lámina 43"},{"titulo":"Etapa 7 (Tiempos) · 46. ¿Cuánto tarda todo el proceso de principio a fin?","texto":"Etapa 7 (Tiempos) · 46. ¿Cuánto tarda todo el proceso de principio a fin?\n\nRESPUESTA SUGERIDA AL CLIENTE\nSumando las dos etapas, un caso normal toma aproximadamente entre 3 y 4 meses desde que recibimos su documentación completa:\nUPME: hasta 30 días hábiles (con frecuencia cerca de una semana).\nPreparación del paquete, firma y cita DIAN: depende de la disponibilidad de citas en su seccional.\nDIAN: hasta 50 días hábiles desde la radicación.\nLe mantendremos informado en cada hito (radicado UPME, certificado, cita, radicado DIAN, resolución y giro).\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEstimación orientativa; no comprometerse con fecha. Las citas DIAN (Bogotá, Medellín, Cali, Bucaramanga) se liberan los viernes y se agotan en segundos.\nFuente: Guía de referencia §1.1 y §8"},{"titulo":"Etapa 7 (Tiempos) · 47. ¿Me pueden garantizar una fecha exacta de consignación?","texto":"Etapa 7 (Tiempos) · 47. ¿Me pueden garantizar una fecha exacta de consignación?\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo sería responsable indicarle una fecha exacta, porque los tiempos dependen de la evaluación de cada entidad y de que no haya requerimientos adicionales.\nLo que sí podemos asegurarle es acompañar y hacer seguimiento a cada etapa, mantenerle informado y actuar de inmediato ante cualquier requerimiento, para que el proceso avance sin demoras atribuibles a la documentación.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nControl del lenguaje absoluto: nada de \"garantizado\" ni fechas. Explicar plazos legales y que una inadmisión se subsana.\nFuente: Script role play §5 · Capacitación back office lámina 43"},{"titulo":"Etapa 8 (Casos especiales) · 48. El vehículo está a nombre de DOS personas","texto":"Etapa 8 (Casos especiales) · 48. El vehículo está a nombre de DOS personas\n\nRESPUESTA SUGERIDA AL CLIENTE\nComo el vehículo está a nombre de los dos, el trámite se hace a nombre de ambos:\nNecesitamos el RUT actualizado y la cédula de los dos propietarios desde el inicio.\nUno de los dos le otorga un poder al otro para presentar la solicitud ante la DIAN y recibir el giro en su cuenta. Ese poder se autentica en notaría: es el único documento de todo el trámite que va ante notario, y nosotros lo redactamos.\nEl certificado UPME sale a nombre de los dos, y tanto la tarifa UPME como nuestros honorarios son uno solo por vehículo.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEscalar a jurídico (redacta el poder especial con autenticación de firma y reconocimiento de contenido). En la UPME se crea un solo caso con los dos en \"Solicitantes asociados\". El giro va a la cuenta indicada en el poder (la del apoderado). Los dos RUT deben tener la misma dirección que irá en los documentos.\nFuente: Guía de referencia §5.1 · Estructura de interacción §5"},{"titulo":"Etapa 8 (Casos especiales) · 49. ¿A quién le hacen la devolución si somos dos propietarios?","texto":"Etapa 8 (Casos especiales) · 49. ¿A quién le hacen la devolución si somos dos propietarios?\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa DIAN gira a una sola cuenta: la del propietario que presenta la solicitud. Para eso, el otro propietario le otorga un poder autenticado en notaría autorizándolo a radicar y a recibir el giro en su cuenta.\nNosotros preparamos ese poder; ustedes únicamente lo firman y lo autentican.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCláusula estándar de cobeneficiarios en la solicitud, la relación y la declaración. Anexos: poder autenticado, cédula y RUT de ambos.\nFuente: Estructura de interacción §5 · Guía de referencia §5.1"},{"titulo":"Etapa 8 (Casos especiales) · 50. El vehículo está a nombre de una empresa (persona jurídica)","texto":"Etapa 8 (Casos especiales) · 50. El vehículo está a nombre de una empresa (persona jurídica)\n\nRESPUESTA SUGERIDA AL CLIENTE\n¡Claro que aplica! Cuando el vehículo está a nombre de una empresa, la solicitante es la sociedad y actúa su representante legal. El proceso es el mismo (UPME y DIAN), con tres diferencias:\nSe anexa el certificado de Cámara de Comercio (menos de 30 días) y la cédula del representante legal.\nLas certificaciones las firman el representante legal y el contador público (o el revisor fiscal, si la empresa está obligada a tenerlo), y anexamos su tarjeta profesional.\nLa cuenta para el giro debe estar a nombre de la empresa.\nEnvíeme el RUT de la empresa, la factura y la Cámara de Comercio y reviso su caso.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRuta especial → escalar SIEMPRE a jurídico. En la UPME el registro es con el NIT sin DV; nombre = razón social exacta. Persona jurídica puede además marcar depreciación acelerada en la UPME (lo maneja jurídico; no se le vende al cliente).\nFuente: Guía de referencia §4.2 (ruta D) y §7.5 · Capacitación back office lámina 32"},{"titulo":"Etapa 8 (Casos especiales) · 51. El cliente ya vendió el vehículo","texto":"Etapa 8 (Casos especiales) · 51. El cliente ya vendió el vehículo\n\nRESPUESTA SUGERIDA AL CLIENTE\nUsted conserva el derecho. Si usted fue el primer comprador (la factura del vehículo nuevo quedó a su nombre y pagaste el IVA), puede solicitar la devolución aunque ya lo haya vendido, siempre dentro de los 5 años desde la factura.\nLo determinante es contar con la documentación: factura, RUT y cédula. Envíemelos y validamos su caso.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSe tramita igual. La deducción del 50 % en renta no se le ofrece a quien ya vendió el carro (Estructura SURA: \"solo al beneficio de la devolución del IVA\").\nFuente: Estructura de interacción §5 · Script role play §12 · Guía de referencia §5.5"},{"titulo":"Etapa 8 (Casos especiales) · 52. El vehículo está en leasing o con prenda","texto":"Etapa 8 (Casos especiales) · 52. El vehículo está en leasing o con prenda\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara orientarlo correctamente necesito revisar la factura. Si la factura del vehículo está a su nombre (aunque mencione a la entidad financiera por la prenda o el crédito), el trámite se hace normalmente.\nSi el vehículo está en leasing financiero y la factura quedó a nombre del banco o la leasing, el caso requiere una revisión jurídica antes de cotizarlo. envíeme la factura y le confirmo.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nFactura que menciona GM Financial u otra entidad pero el titular es el cliente → se tramita sin cláusula de leasing. Factura a nombre de la entidad financiera → escalar a jurídico ANTES de cotizar.\nFuente: Guía de referencia §5.3"},{"titulo":"Etapa 8 (Casos especiales) · 53. El titular quiere que otra persona (apoderado) haga el trámite","texto":"Etapa 8 (Casos especiales) · 53. El titular quiere que otra persona (apoderado) haga el trámite\n\nRESPUESTA SUGERIDA AL CLIENTE\nEs posible. El titular del vehículo puede facultar a un apoderado para presentar la solicitud ante la DIAN mediante un poder; nosotros lo preparamos.\nTenga en cuenta que el Formulario 010 lo firma siempre el titular y que la devolución se gira únicamente a la cuenta bancaria del titular (nunca a la del apoderado). ¿Me confirma quién sería el apoderado y me envía el RUT y la cédula del titular?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRuta especial → escalar a jurídico. Poder art. 555-1 E.T. El apoderado firma la declaración juramentada y la relación de facturas como \"apoderado especial de \u003ctitular>\".\nFuente: Guía de referencia §5.2"},{"titulo":"Etapa 8 (Casos especiales) · 54. La factura trae IVA del 19 % o no discrimina el IVA","texto":"Etapa 8 (Casos especiales) · 54. La factura trae IVA del 19 % o no discrimina el IVA\n\nRESPUESTA SUGERIDA AL CLIENTE\nGracias por enviarla. Al revisarla veo que [la factura trae IVA del 19 % / no muestra el IVA discriminado]. Los vehículos eléctricos e híbridos se facturan con IVA del 5 %, así que necesito validar este punto con nuestro departamento jurídico antes de confirmarte si el caso aplica.\nle escribo tan pronto tenga respuesta.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSeñal de alerta: si la factura trae IVA 19 %, el carro no fue facturado como eléctrico/híbrido → escalar. Factura sin IVA discriminado → corregir antes de seguir (pedir al concesionario la factura electrónica de venta).\nFuente: Guía de referencia §2.3 (3 pasos) y §10.2"},{"titulo":"Etapa 8 (Casos especiales) · 55. El cliente cambió de ciudad o de dirección después de comprar","texto":"Etapa 8 (Casos especiales) · 55. El cliente cambió de ciudad o de dirección después de comprar\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo hay problema, pero es importante que su RUT tenga la dirección, el correo y el teléfono actuales antes de radicar, porque todos los documentos deben coincidir con el RUT.\nSi la dirección del certificado UPME quedó distinta a la del RUT, preparamos una carta de aclaración para la DIAN. envíeme su RUT actualizado y lo revisamos.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nLa seccional DIAN es la de la casilla 12 del RUT, no la ciudad donde vive el cliente (p. ej. residentes de Chía/Funza pueden tener seccional Bogotá). Dirección distinta entre certificado UPME y RUT → carta de aclaración (minuta de la firma).\nFuente: Guía de referencia §4.1 y §5.5"},{"titulo":"Etapa 9 (Objeciones y confianza) · 56. Objeción de precio: «me parece costoso» / «lo puedo hacer solo»","texto":"Etapa 9 (Objeciones y confianza) · 56. Objeción de precio: «me parece costoso» / «lo puedo hacer solo»\n\nRESPUESTA SUGERIDA AL CLIENTE\nEntiendo su inquietud, y es válida. Nuestro servicio existe para que no tenga que gestionar por su cuenta la revisión documental, el registro en la plataforma de la UPME, el Formulario 010 y sus anexos, la cita, la radicación y el seguimiento de requerimientos entre dos entidades.\nLa mayoría de las inadmisiones de la DIAN son errores de forma: un RUT desactualizado, un correo distinto, una certificación bancaria vencida, un formulario en formato viejo o un valor mal copiado. Nosotros ya hemos tramitado más de 150 casos y sabemos exactamente qué revisa la DIAN.\nY su dinero nunca pasa por nosotros: la DIAN le gira directamente a su cuenta.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nArgumentar valor, no precio. Cifra de referencia: la firma ha atendido más de 155 casos ante la UPME y la DIAN (sep-2026). No desacreditar al cliente que quiera hacerlo solo.\nFuente: Script role play §8 · Guía de referencia (nota final) y §10.3"},{"titulo":"Etapa 9 (Objeciones y confianza) · 57. ¿Concretamente qué hacen ustedes por mí?","texto":"Etapa 9 (Objeciones y confianza) · 57. ¿Concretamente qué hacen ustedes por mí?\n\nRESPUESTA SUGERIDA AL CLIENTE\nConcretamente:\nRevisamos su documentación y validamos que el vehículo y el titular cumplen.\nCreamos su cuenta y su caso en la plataforma de la UPME, coordinamos el pago de la tarifa y revisamos el certificado dígito por dígito contra su RUT y su factura.\nDiligenciamos el Formulario 010 y redactamos la solicitud, la relación de facturas y la declaración juramentada (usted solo firmas).\nAgendamos la cita en la DIAN (si su seccional la exige), radicamos y respondemos cualquier requerimiento.\nHacemos seguimiento hasta que el dinero llegue a su cuenta y le mantenemos informado en cada hito.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nAlcance del servicio completo. La cita DIAN nunca se vende sola.\nFuente: Script role play §8 · Capacitación agentes lámina 6"},{"titulo":"Etapa 9 (Objeciones y confianza) · 58. Cliente desconfiado: «¿cómo sé que esto es legítimo?»","texto":"Etapa 9 (Objeciones y confianza) · 58. Cliente desconfiado: «¿cómo sé que esto es legítimo?»\n\nRESPUESTA SUGERIDA AL CLIENTE\nEs completamente válido que quiera confirmarlo antes de compartir documentos. Mi nombre es [nombre], soy consultor(a) de Gómez Legal Abogados S.A.S., firma de abogados con sede en Medellín, y esta gestión se realiza en alianza con SURA, que es quien nos compartió su contacto como cliente.\nAntes de enviar información recibirá el contrato de prestación de servicios con el alcance exacto de lo que hacemos, y todos los pagos quedan soportados. Sus datos se utilizan únicamente para este trámite ante la UPME y la DIAN.\nSi lo prefiere, puede validar la alianza directamente con su canal de SURA.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSerenidad, sin confrontar. No pedir nunca claves bancarias ni datos que no necesite el trámite. Ley 1581/2012 (tratamiento de datos).\nFuente: Script role play §13"},{"titulo":"Etapa 9 (Objeciones y confianza) · 59. ¿Me entregan soporte de lo que pague?","texto":"Etapa 9 (Objeciones y confianza) · 59. ¿Me entregan soporte de lo que pague?\n\nRESPUESTA SUGERIDA AL CLIENTE\nSí, siempre. Todos los pagos quedan soportados: recibe el comprobante de pago de los honorarios y el contrato de prestación de servicios, y para la tarifa de la UPME le compartimos el soporte de pago ante la entidad (o usted nos lo envía si la paga directamente).\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nEl comprobante de pago y el contrato aceptado son requisitos para iniciar la gestión.\nFuente: Script role play §13"},{"titulo":"Etapa 9 (Objeciones y confianza) · 60. «Entonces la UPME me devuelve el IVA» / confusión de entidades","texto":"Etapa 9 (Objeciones y confianza) · 60. «Entonces la UPME me devuelve el IVA» / confusión de entidades\n\nRESPUESTA SUGERIDA AL CLIENTE\nPermítame hacer una precisión para que quede clarísimo:\nLa UPME expide el certificado que acredita que su vehículo cumple los requisitos.\nLa DIAN es la entidad que estudia la solicitud y le devuelve el IVA.\nGómez Legal Abogados gestiona y acompaña todo el proceso; las decisiones son de las entidades.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCorregir con tacto; repetir las tres funciones cuantas veces sea necesario.\nFuente: Script role play §14"},{"titulo":"Etapa 9 (Objeciones y confianza) · 61. El cliente prefiere hacer el trámite por su cuenta","texto":"Etapa 9 (Objeciones y confianza) · 61. El cliente prefiere hacer el trámite por su cuenta\n\nRESPUESTA SUGERIDA AL CLIENTE\nTotalmente respetable. El trámite se puede adelantar directamente ante la UPME y la DIAN.\nSolo le dejo dos recomendaciones: radique todo desde el correo registrado en su RUT y con sus datos exactamente iguales al RUT, y solicite la certificación bancaria solo cuando vayas a radicar (vence a los 30 días).\nSi en algún momento prefiere que lo hagamos por ti, o si la DIAN le inadmite la solicitud, con gusto podremos apoyarlo.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nCerrar con la puerta abierta y registrar en el CRM como \"perdido\" con observación. No insistir.\nFuente: Guía de referencia §10.3"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 62. Aviso: caso creado y pagado en la UPME","texto":"Etapa 10 (Después de radicar y seguimiento) · 62. Aviso: caso creado y pagado en la UPME\n\nRESPUESTA SUGERIDA AL CLIENTE\nActualización de su proceso: Su caso ya quedó creado y pagado en la plataforma de la UPME con el radicado [VEH_GEE…] del [fecha].\nAhora la entidad valida la solicitud; tiene hasta 30 días hábiles, aunque con frecuencia responde antes. Le avisaré apenas salga el certificado o si la UPME pide algún documento adicional.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nAnotar radicado VEH_GEE y fecha en el cuadro madre / CRM. Estado: \"creado en UPME – pago realizado en UPME\".\nFuente: Capacitación back office lámina 24 · Estructura de interacción §8"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 63. La UPME pide información adicional (requerimiento)","texto":"Etapa 10 (Después de radicar y seguimiento) · 63. La UPME pide información adicional (requerimiento)\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa UPME nos envió un requerimiento sobre su caso: nos pide [documento / aclaración]. Es algo habitual y no significa que la solicitud vaya mal.\nNosotros revisamos el requerimiento y preparamos la respuesta; de su parte necesitamos [lo que se necesite del cliente] antes del [fecha]. Mientras respondemos, el plazo de la UPME queda en pausa.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nLos requerimientos suspenden el plazo de evaluación. Responder rápido y completo; escalar a jurídico si el requerimiento es de fondo.\nFuente: Script role play §5 · Guía de referencia §9.4"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 64. Aviso: certificado UPME expedido","texto":"Etapa 10 (Después de radicar y seguimiento) · 64. Aviso: certificado UPME expedido\n\nRESPUESTA SUGERIDA AL CLIENTE\nExcelente noticia. La UPME ya expidió su certificado (radicado [VEH_GEE…] del [fecha]). Lo revisamos dígito por dígito contra su RUT y su factura y está correcto.\nAhora preparamos el paquete para la DIAN: en los próximos días le enviaré los cuatro documentos para su firma y le solicitaré la certificación bancaria (recuerda: expedida hace menos de 30 días, cuenta a su nombre).\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nAntes de avisar, revisar el certificado (cédula, nombre, valor, marca/línea, todos los carros). Pedir la certificación bancaria SOLO cuando el paquete esté listo.\nFuente: Capacitación back office lámina 26"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 65. Envío de documentos para firma","texto":"Etapa 10 (Después de radicar y seguimiento) · 65. Envío de documentos para firma\n\nRESPUESTA SUGERIDA AL CLIENTE\nle envío los cuatro documentos para su firma: Formulario 010, solicitud, relación de facturas y declaración juramentada.\nPor favor, fírmelos con firma visible: imprímelos, fírmalos a mano con lapicero negro y escanéalos (o fírmalos dibujando la firma sobre el PDF). No utilice firma electrónica invisible ni modifiques ningún dato: si ves algo que no coincide con su RUT, infórmeme antes de firmar.\nDevuélvalos por este medio junto con la certificación bancaria.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSi el cliente devuelve el 010 con datos corregidos a mano, se usan esos datos y el cliente debe actualizar el RUT ANTES de radicar. Renderizar y revisar los documentos antes de enviarlos a firma.\nFuente: Guía de referencia §7.5 y §5.5"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 66. ¿Cómo es la cita en la DIAN? ¿Tengo que ir?","texto":"Etapa 10 (Después de radicar y seguimiento) · 66. ¿Cómo es la cita en la DIAN? ¿Tengo que ir?\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo tiene que ir a ninguna oficina. La cita es virtual (videoatención) y solo la exigen las seccionales de Bogotá, Medellín, Cali y Bucaramanga; en las demás ciudades la solicitud se envía directamente al buzón de la seccional, sin cita.\nNosotros nos encargamos de conseguir la cita (los cupos se liberan los viernes y se agotan en segundos) y de radicar en la fecha y hora asignadas. Lo único que coordinaremos con usted es que el envío salga desde el correo registrado en su RUT; le explicaremos exactamente cómo cuando llegue el momento.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nSeccional = casilla 12 del RUT. Bogotá: el funcionario se conecta y se suben los documentos por separado en la sesión (entrar 15 min antes). Medellín/Cali/Bucaramanga: nadie se conecta; se envía el correo con el PDF completo en la fecha y hora exacta de la cita. Otras seccionales: correo al buzón. Persona jurídica: fila distinta en el agendamiento.\nFuente: Guía de referencia §8 · Capacitación back office láminas 37-42"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 67. Aviso: solicitud radicada en la DIAN","texto":"Etapa 10 (Después de radicar y seguimiento) · 67. Aviso: solicitud radicada en la DIAN\n\nRESPUESTA SUGERIDA AL CLIENTE\nListo. Su solicitud de devolución quedó radicada ante la DIAN con el número [radicado] del [fecha].\nDesde hoy corren los 50 días hábiles que tiene la entidad para resolver (en calendario, entre 2 y 3 meses). Le informaremos apenas haya novedad.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nGuardar acuse de radicado en la carpeta del cliente. Estado CRM: \"cliente radicado en DIAN\".\nFuente: Guía de referencia §8.3"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 68. La DIAN emitió un auto inadmisorio","texto":"Etapa 10 (Después de radicar y seguimiento) · 68. La DIAN emitió un auto inadmisorio\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa DIAN nos envió un auto inadmisorio de su solicitud. Tranquilo: no es un rechazo ni afecta su derecho. La entidad señala una corrección de forma ([describir]); la hacemos y volvemos a radicar el paquete completo dentro del plazo.\nDe su parte necesitamos [nuevo documento / firma], si aplica. Cuando quede radicada de nuevo, el plazo de la DIAN vuelve a correr.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nArt. 858 E.T.: se subsana y se presenta de nuevo TODA la solicitud con el auto anexo dentro del mes siguiente. Jurídico responde con PQR cuando la causal es error de la DIAN (precedentes: CUFE \"no verificable\", código 13 vs 31, formato \"actualizado\"). Causal real más frecuente: certificación bancaria vencida.\nFuente: Guía de referencia §8.3 y §9.3"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 69. Aviso: resolución de devolución expedida","texto":"Etapa 10 (Después de radicar y seguimiento) · 69. Aviso: resolución de devolución expedida\n\nRESPUESTA SUGERIDA AL CLIENTE\nMuy buenas noticias. La DIAN expidió la resolución que reconoce la devolución de su IVA por $[valor] y ordena el giro a su cuenta [banco – tipo].\nEl dinero suele reflejarse en los días siguientes. Por favor revisa su cuenta y confírmanos cuando lo reciba para cerrar su caso.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nGuardar la resolución en la carpeta del cliente. Si la cuenta quedó mal transcrita en la resolución, jurídico pide corrección por error formal (art. 45 CPACA).\nFuente: Guía de referencia §8.3"},{"titulo":"Etapa 10 (Después de radicar y seguimiento) · 70. El cliente pregunta por el estado de su proceso","texto":"Etapa 10 (Después de radicar y seguimiento) · 70. El cliente pregunta por el estado de su proceso\n\nRESPUESTA SUGERIDA AL CLIENTE\nBuenos días/tardes, [nombre]. Con gusto le actualizo. Su caso está en la etapa: [creado en UPME – pendiente certificado / certificado expedido – preparando paquete DIAN / pendiente cita DIAN / radicado en DIAN el (fecha) – en plazo de respuesta / resolución expedida – pendiente giro].\nEl siguiente hito es [hito] y le avisaré apenas ocurra. Si tiene alguna inquietud, estoy atento(a).\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nConsultar el estado real en el CRM / cuadro madre antes de responder. No inventar fechas.\nFuente: Estructura de interacción §8 (estados del proceso)"},{"titulo":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 71. «¿Me garantizan que me devuelven el 100 % del IVA?»","texto":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 71. «¿Me garantizan que me devuelven el 100 % del IVA?»\n\nRESPUESTA SUGERIDA AL CLIENTE\nLa gestión la hacemos con el objetivo de obtener la devolución del IVA que pagó, y para eso cuidamos cada detalle del proceso.\nLo que debe saber con total transparencia: la decisión final es de la DIAN, y el valor que finalmente reciba puede variar si tiene obligaciones pendientes con la entidad, porque la DIAN puede compensarlas antes de girar. Fuera de eso, la devolución corresponde al IVA que aparece en su factura.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nNo usar \"garantizamos el 100 %\". Compensación: art. 861 E.T. Responder SOLO si el cliente pregunta; cualquier discusión de fondo se escala a jurídico.\nFuente: Script role play §9 · Guía de referencia §3 (reglas de valores)"},{"titulo":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 72. «Tengo una deuda con la DIAN, ¿qué pasa?»","texto":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 72. «Tengo una deuda con la DIAN, ¿qué pasa?»\n\nRESPUESTA SUGERIDA AL CLIENTE\nSi tiene obligaciones pendientes con la DIAN, la entidad puede aplicar la devolución como abono o compensación de esas obligaciones antes de girar. Por eso el valor que llegue a su cuenta podría ser diferente al solicitado.\nNo podemos determinar con exactitud cuánto recibiría sin conocer la situación que la DIAN tenga registrada al momento de resolver; si desea, revisamos su caso con nuestro equipo jurídico.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nArt. 861 E.T. Solo si el cliente pregunta. Escalar a jurídico si quiere detalle.\nFuente: Script role play §9 · Estructura de interacción §5"},{"titulo":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 73. «¿La devolución siempre llega a mi cuenta bancaria?»","texto":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 73. «¿La devolución siempre llega a mi cuenta bancaria?»\n\nRESPUESTA SUGERIDA AL CLIENTE\nEn la práctica, sí: la DIAN gira a la cuenta bancaria a su nombre que registramos en la solicitud.\nSolo para devoluciones muy altas (superiores a 1.000 UVT, unos $52 millones en 2026) la ley permite que la DIAN devuelva mediante títulos (TIDIS) en lugar de giro; para el IVA de un vehículo eso es excepcional.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nArt. 862 E.T.: devoluciones superiores a 1.000 UVT pueden hacerse con TIDIS. 1.000 UVT 2026 = $52.374.000. Un IVA de esa magnitud implica un carro de más de $1.000 M sin IVA.\nFuente: Script role play §7 · Estructura de interacción §5"},{"titulo":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 74. «¿Me devuelven también el impuesto al consumo?»","texto":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 74. «¿Me devuelven también el impuesto al consumo?»\n\nRESPUESTA SUGERIDA AL CLIENTE\nNo. El beneficio de la Ley 1715 cubre únicamente el IVA del vehículo. El impuesto nacional al consumo (que traen algunos híbridos) y el IVA de accesorios, matrícula o planes de mantenimiento no hacen parte de la devolución.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nINC 8 % (o 16 % en algunos PHEV de lujo) se lee de la factura y se menciona solo como dato en la solicitud.\nFuente: Guía de referencia §3"},{"titulo":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 75. «¿Puedo usar la cuenta donde me consignan la pensión?»","texto":"Etapa 11 (Respuestas solo cuando el cliente pregunta) · 75. «¿Puedo usar la cuenta donde me consignan la pensión?»\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara este trámite la DIAN no acepta la cuenta de mesada pensional. Necesitamos una cuenta de ahorros o corriente a su nombre, en un banco con convenio con la DIAN. Si no tiene otra, puede abrir una (por ejemplo, una cuenta de ahorros digital) y enviarnos la certificación cuando vayamos a radicar.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRegla de la firma: nunca cuenta pensional. Nu Colombia se ha aceptado con el nombre exacto \"Nu Colombia Compañía de Financiamiento S.A.\".\nFuente: Guía de referencia §4.4"},{"titulo":"Etapa 12 (Cierre) · 76. Recapitulación y siguientes pasos","texto":"Etapa 12 (Cierre) · 76. Recapitulación y siguientes pasos\n\nRESPUESTA SUGERIDA AL CLIENTE\nLe resumo: su caso cumple preliminarmente con los criterios. El siguiente paso es que acepte el servicio: le envío por WhatsApp el enlace de pago y el contrato de prestación de servicios de Gómez Legal Abogados.\nUna vez realizado el pago, me envía por este medio la documentación completa (RUT, factura, cédula y contraseñas) dentro de las siguientes 24 horas y iniciamos la gestión ante la UPME. Luego, con el certificado, continuamos con la DIAN y le acompañamos hasta el giro.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nDejar claro que la firma se encarga de todo el trámite. Registrar en el CRM: \"Cliente acepta – pendiente de pago y documentos\".\nFuente: Estructura de interacción §7 · Script role play §16"},{"titulo":"Etapa 12 (Cierre) · 77. Preferencias de contacto y periodicidad","texto":"Etapa 12 (Cierre) · 77. Preferencias de contacto y periodicidad\n\nRESPUESTA SUGERIDA AL CLIENTE\nPara mantenerle informado, ¿prefiere que lo contactemos semanalmente, cada quince días o únicamente cuando haya una novedad relevante (radicado, certificado, cita con la DIAN, resolución)?\n¿Y le resulta más conveniente por WhatsApp o por llamada?\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nRegistrar periodicidad y canal en el CRM. Si hay una novedad antes del plazo, comunicarla igual.\nFuente: Estructura de interacción §7 · Script role play §16"},{"titulo":"Etapa 12 (Cierre) · 78. Despedida","texto":"Etapa 12 (Cierre) · 78. Despedida\n\nRESPUESTA SUGERIDA AL CLIENTE\nPerfecto, [nombre]. En unos minutos le envío por WhatsApp el contrato, el enlace de pago y la lista de documentos. Recuerda que, una vez realizado el pago, necesitamos la documentación completa dentro de las siguientes 24 horas para iniciar.\nMuchas gracias por su tiempo. Quedo atento(a) a cualquier inquietud por este mismo medio. Que tenga un excelente día.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nJusto después de la interacción, registrar el caso con el estado correspondiente.\nFuente: Script role play §16 · Estructura de interacción §8"},{"titulo":"Etapa 12 (Cierre) · 79. Respuesta rápida bajo presión (el cliente pide todo en un mensaje)","texto":"Etapa 12 (Cierre) · 79. Respuesta rápida bajo presión (el cliente pide todo en un mensaje)\n\nRESPUESTA SUGERIDA AL CLIENTE\nClaro, se lo resumo:\npaga: $600.000 + IVA ($714.000) de honorarios, pago único, más la tarifa oficial de la UPME (para la mayoría de vehículos, $701.812 en 2026).\nDocumentos: RUT actualizado, factura, cédula, contraseñas de los PDF, comprobante de pago y contrato aceptado.\nEl certificado lo expide la UPME; el dinero lo devuelve la DIAN directamente a su cuenta.\n⏱ UPME: hasta 30 días hábiles (con frecuencia puede ser menor). DIAN: hasta 50 días hábiles desde la radicación.\n↩ Volver al inicio\nNOTA INTERNA · NO ENVIAR AL CLIENTE\nVersión comprimida para clientes con poco tiempo. Sin prometer fechas.\nFuente: Script role play §17\n\nAnexo 1. Checklist de escalamiento jurídico\n\n☐ Vehículo a nombre de una empresa.\n\n☐ Vehículo a nombre de dos personas.\n\n☐ Cliente que actuará mediante apoderado.\n\n☐ RUT con códigos 42 o 48.\n\n☐ Leasing con factura a nombre de la entidad financiera.\n\n☐ Factura con IVA del 19 % o sin IVA discriminado.\n\n☐ Certificado UPME con errores en nombre, identificación, valor o datos del vehículo.\n\n☐ Cualquier contradicción entre factura, RUT, certificado UPME o titularidad.\n\nRegla:\n\nNo confirmar viabilidad definitiva, cotización especial ni radicación hasta recibir validación del departamento jurídico.\n\nAnexo 2. Valores operativos de referencia 2026\n\nLos valores siguientes provienen de la guía operativa suministrada. Deben revisarse y actualizarse cuando cambie la UVT o la tarifa aplicable.\n\n  Concepto                                                           Valor / regla                                                      Observación\n  Honorarios proceso completo                                        $600.000 + IVA = $714.000                                          Pago único por vehículo para cliente SURA.\n\n  Honorarios si ya tiene certificado UPME                            $300.000 + IVA = $357.000                                          Gestión de la etapa DIAN.\n\n  UVT 2026                                                           $52.374                                                            Actualizar cada enero.\n\n  UPME                                                               Según rango / fórmula oficial                                      Se calcula sobre el valor del vehículo sin IVA.\n\n  DIAN                                                               Hasta 50 días hábiles desde radicación                             No prometer fecha exacta de giro."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 80. Instructivo para que el cliente realice directamente el pago en la UPME","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 80. Instructivo para que el cliente realice directamente el pago en la UPME\n\nUtilice esta respuesta cuando el caso ya esté creado en la plataforma de la UPME y el cliente haya elegido realizar directamente el pago de la tarifa correspondiente al certificado.\n\nRESPUESTA PREDEFINIDA AL CLIENTE — TEXTO LITERAL SOLICITADO\nSeñor Oscar, enviamos el paso a paso e instructivo para ingresar a la UPME y pagar directamente el tramite\nUsuario: 12999763\nContraseña: OSCAR2026\nIngresas al Caso VEH_GEE2026165876\nAsi mismo enviamos el link de acceso, la clave, la contraseña y el paso a paso para que ingreses al aplicativo de la UPME y pagues el valor del certificado directamente por el aplicativo. Ingresas de acuerdo al paso a paso, seleccionas HABILITAR PAGO - PAGAR POR WOMPI- , una vez pagues, le das regresar al comercio y siguiente. Me avisas cuando hayas pagado para continuar el tramite.\nGracias\nImportante, no habilita el pago haciéndolo desde el celular el pago se realiza por el aplicativo WOMPI que es PSE\nEn caso de que desee que nosotros paguemos por usted, este servicio tiene un sobre costo de $15.000 adicional al pago de la UPME\n↩ Volver al inicio\n\nPaso 1. Ingresar a los casos pendientes\n\nIngrese al portal de la UPME con las credenciales enviadas al cliente y seleccione la opción «Pendiente» para visualizar el caso correspondiente.\n\n[]\n\nPaso 2. Abrir el caso y seleccionar «Trabajar aquí»\n\nUbique el número de caso informado en el mensaje y seleccione «Trabajar aquí» para ingresar al detalle del trámite.\n\n[]\n\nPaso 3. Habilitar y realizar el pago\n\nEn la sección «Tarifa a pagar», seleccione «Habilitar pago». Continúe con la opción de pago por WOMPI/PSE. Una vez finalizado el pago, seleccione «Regresar al comercio» y posteriormente «Siguiente» para continuar el trámite.\n\n[]\n\nNota interna para el agente\n\nAntes de enviar el instructivo, reemplace el nombre del cliente, usuario, contraseña y número de caso por los datos reales. Confirme que el cliente realizará el pago desde un computador. Solicite confirmación una vez efectuado el pago para que el equipo pueda continuar con la gestión. Si el cliente solicita que Gómez Legal Abogados realice el pago por su cuenta, informe el sobrecosto de $15.000 adicional al valor de la tarifa UPME, conforme a la instrucción operativa suministrada.\n\nHallazgos incorporados de los chats revisados\n\nLa actualización refuerza el acompañamiento en pagos y estado del proceso, debido a que en los chats revisados se observan consultas recurrentes sobre certificado UPME, factura, DIAN, documentación, valores, pagos y tiempos. La respuesta anterior busca reducir fricción en uno de esos puntos operativos: el pago directo de la tarifa UPME.\n\n14. Scripts de conversión basados en conversaciones con resultado positivo\n\nEsta sección consolida patrones de comunicación observados en conversaciones en las que el cliente avanzó desde el interés hasta la aceptación del servicio, firma del contrato y/o pago. Los textos se normalizan al tratamiento de «usted», sin emojis y con llamados a la acción claros. No deben entenderse como garantía de conversión; son guiones operativos derivados de interacciones que mostraron avance positivo."},{"titulo":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 81. Validación positiva después de revisar la factura","texto":"Etapa 13 (Pago directo de la tarifa UPME por cuenta del cliente) · 81. Validación pos
